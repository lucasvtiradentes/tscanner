name: 'PR Validation'

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pr_ci:
    name: 'PR CI'
    uses: ./.github/workflows/callable-ci.yml
    with:
      run_lint: true
      run_build: true
      run_test: true
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  tscanner_pr_check:
    name: 'TScanner PR Check'
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore file mtimes for cache
        uses: chetan/git-restore-mtime-action@v2

      - uses: ./.github/actions/setup-and-install

      - name: Build project
        run: pnpm run build

      - name: Copy Rust binary for CLI
        run: |
          mkdir -p packages/cli/npm/cli-linux-x64
          cp packages/rust-core/target/release/tscanner packages/cli/npm/cli-linux-x64/tscanner
          chmod +x packages/cli/npm/cli-linux-x64/tscanner

      - name: Detect AI provider
        id: ai-provider
        run: |
          PROVIDER=$(node -e "const fs=require('fs'); const c=fs.readFileSync('.tscanner/config.jsonc','utf8').replace(/\/\/.*/g,''); const j=JSON.parse(c); console.log(j.ai?.provider || 'none')")
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT

      - name: Setup AI provider
        if: steps.ai-provider.outputs.provider != 'none'
        uses: lucasvtiradentes/setup-ai-provider@v0
        with:
          provider: ${{ steps.ai-provider.outputs.provider }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          gemini-auth-json: ${{ secrets.GEMINI_CREDENTIALS }}
          artifact-name: ai-chat-logs
          upload-session-files: 'true'

      - uses: ./packages/github-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dev-mode: 'true'
          target-branch: 'origin/main'
          timezone: 'America/Sao_Paulo'
          summary: 'true'
          annotations: 'true'
          pr-comment: 'true'
          ai-mode: 'include'
          # continue-on-error: 'true'
          # no-cache: 'true'

      - name: Show TScanner logs
        if: always()
        run: |
          echo "=== TScanner Logs ==="
          cat /tmp/tscannerlogs.txt 2>/dev/null || echo "No logs found at /tmp/tscannerlogs.txt"
